name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip "setuptools>=83" && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Lint and format check
        run: python -m ruff check . && python -m ruff format --check .

      - name: Type check
        run: python -m mypy hf_dataset_guard

      - name: Dependency audit
        run: python -m pip_audit

      - name: Build package and smoke-test wheel
        run: |
          python -m build
          python -m venv wheel-env
          wheel-env/bin/python -m pip install dist/*.whl
          wheel-env/bin/hf-dataset-guard scan --help
