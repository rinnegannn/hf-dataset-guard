[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-dataset-guard"
version = "0.1.0"
description = "Static security scanner for Hugging Face dataset repos: pickle risk, remote code execution, template injection, exposed secrets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "hf-dataset-guard maintainers" },
]
keywords = ["hugging-face", "datasets", "security", "static-analysis", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "huggingface_hub>=0.24",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
    "types-PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/rinnegannn/hf-dataset-guard"
Repository = "https://github.com/rinnegannn/hf-dataset-guard"
Issues = "https://github.com/rinnegannn/hf-dataset-guard/issues"

[project.scripts]
hf-dataset-guard = "hf_dataset_guard.cli:main"

[tool.setuptools.packages.find]
include = ["hf_dataset_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hf_dataset_guard --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
